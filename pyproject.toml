[project]
name = "llmlib"
version = "0.1.0"
description = "A CLI tool that turns LLM export files into a personal, queryable knowledge library."
authors = [{ name = "Your Name", email = "your.email@example.com" }]
dependencies = [
    "typer>=0.12.0",
    "sqlite-vec>=0.1.0",
    "google-genai",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
llmlib = "llmlib.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmlib*"]
