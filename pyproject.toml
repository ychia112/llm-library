[project]
name = "llmlib"
version = "0.1.0"
description = "A CLI tool that turns LLM export files into a personal, queryable knowledge library."
authors = [{ name = "Theo", email = "yuchiacheng12@gmail.com" }]
dependencies = [
    "typer>=0.12.0",
    "sqlite-vec>=0.1.0",
    "google-genai",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
api = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]
mcp = ["mcp>=1.0.0"]
cluster = ["umap-learn>=0.5", "hdbscan>=0.8", "numpy>=1.24"]

[project.scripts]
llmlib = "llmlib.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmlib*"]
